name: Bản tin thị trường (07:00 & 18:00 giờ VN)

on:
  # LỊCH CHÍNH: cron-job.org gọi workflow_dispatch đúng 06:05 và 17:05 với scheduled=yes
  # (xem README, mục "Lịch chạy đúng giờ"). Lịch GitHub bên dưới chỉ là DỰ PHÒNG:
  # GitHub ghi rõ sự kiện `schedule` có thể bị trễ hoặc bị bỏ khi quá tải, nhất là đầu mỗi giờ,
  # nên các mốc dưới đây dùng phút lẻ, tránh đầu giờ. Lần nào thấy bản tin của phiên đã có thì
  # tự bỏ qua (--skip-if-done); bản tin xong sớm được giữ tới đúng 07:00 / 18:00 (--hold).
  # Giờ UTC; Việt Nam = UTC+7.
  schedule:
    - cron: "12 23 * * *"   # 06:12 giờ VN (phiên sáng, dự phòng 1)
    - cron: "41 23 * * *"   # 06:41 giờ VN (dự phòng 2)
    - cron: "17 0 * * *"    # 07:17 giờ VN (dự phòng 3, gửi trễ)
    - cron: "13 10 * * *"   # 17:13 giờ VN (phiên chiều, dự phòng 1)
    - cron: "44 10 * * *"   # 17:44 giờ VN (dự phòng 2)
    - cron: "17 11 * * *"   # 18:17 giờ VN (dự phòng 3, gửi trễ)
  workflow_dispatch:
    inputs:
      session:
        description: "Phiên (morning/evening). Để trống = tự chọn theo giờ VN"
        required: false
        default: ""
      provider:
        description: "Nhà cung cấp AI (auto = tự chọn theo key có sẵn)"
        type: choice
        options: [auto, groq, gemini, claude]
        default: auto
      mode:
        description: "report = tạo bản tin; check-models = kiểm tra model AI (1 request/model); check-feeds = kiểm tra nguồn dữ liệu miễn phí (không gọi AI)"
        type: choice
        options: [report, check-models, check-feeds]
        default: report
      models:
        description: "(check-models) danh sách model cách nhau dấu cách; trống = model đang cấu hình"
        required: false
        default: ""
      scheduled:
        description: "yes = chạy theo lịch (giữ tới đúng giờ gửi, bỏ qua nếu đã gửi) — dùng cho cron-job.org"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: market-report-${{ github.event.inputs.mode || 'report' }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kiểm tra model Groq
        if: github.event.inputs.mode == 'check-models'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_AI_API }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python -m market_agents.check_models ${{ github.event.inputs.models }}

      - name: Kiểm tra nguồn dữ liệu miễn phí
        if: github.event.inputs.mode == 'check-feeds'
        run: python -m market_agents.datafeeds

      - name: Chạy hệ thống agent
        if: github.event.inputs.mode != 'check-models' && github.event.inputs.mode != 'check-feeds'
        env:
          # Chỉ cần MỘT key. Tự chọn theo thứ tự: Claude > Groq > Gemini
          # (hoặc đặt biến MARKET_AGENTS_PROVIDER trong Settings -> Variables).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET_AGENTS_MODEL: ${{ vars.MARKET_AGENTS_MODEL || 'claude-opus-5-5' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_AI_API }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Ưu tiên: lựa chọn khi chạy tay > biến MARKET_AGENTS_PROVIDER > tự chọn
          MARKET_AGENTS_PROVIDER: ${{ (github.event.inputs.provider != '' && github.event.inputs.provider != 'auto') && github.event.inputs.provider || vars.MARKET_AGENTS_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.session }}" ]; then ARGS="--session ${{ github.event.inputs.session }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.scheduled }}" = "yes" ]; then
            ARGS="$ARGS --hold --skip-if-done"
          fi
          python -m market_agents.main $ARGS > /dev/null

      - name: Lưu báo cáo vào repo
        if: github.event.inputs.mode != 'check-models' && github.event.inputs.mode != 'check-feeds'
        run: |
          git config user.name "market-agents-bot"
          git config user.email "market-agents-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Báo cáo thị trường $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Báo lỗi qua Telegram
        if: failure() && github.event.inputs.mode != 'check-models' && github.event.inputs.mode != 'check-feeds'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          TEXT="⚠️ Bản tin thị trường bị lỗi lúc $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m'). Hệ thống sẽ thử lại ở mốc dự phòng kế tiếp. Xem chi tiết: $RUN_URL"
          curl -sS -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" > /dev/null
