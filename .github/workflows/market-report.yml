name: Bản tin thị trường (07:00 & 18:00 giờ VN)

on:
  schedule:
    # GitHub cron dùng giờ UTC. Việt Nam = UTC+7.
    # Khởi động sớm ~55 phút (gói Gemini miễn phí khá chậm), rồi giữ báo cáo tới đúng giờ mới gửi.
    - cron: "5 23 * * *"    # 06:05 giờ VN -> gửi lúc 07:00
    - cron: "5 10 * * *"    # 17:05 giờ VN -> gửi lúc 18:00
  workflow_dispatch:
    inputs:
      session:
        description: "Phiên (morning/evening). Để trống = tự chọn theo giờ VN"
        required: false
        default: ""
      provider:
        description: "Nhà cung cấp AI (auto = tự chọn theo key có sẵn)"
        type: choice
        options: [auto, openrouter, groq, gemini, claude]
        default: auto
      mode:
        description: "report = tạo bản tin; check-models = chỉ kiểm tra model (1 request/model)"
        type: choice
        options: [report, check-models]
        default: report
      models:
        description: "(check-models) danh sách model cách nhau dấu cách; trống = model đang cấu hình"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kiểm tra model OpenRouter
        if: github.event.inputs.mode == 'check-models'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          P="${{ github.event.inputs.provider }}"
          if [ "$P" = "groq" ]; then ARGS="--provider groq"; else ARGS=""; fi
          python -m market_agents.check_models $ARGS ${{ github.event.inputs.models }}

      - name: Chạy hệ thống agent
        if: github.event.inputs.mode != 'check-models'
        env:
          # Chỉ cần MỘT key. Tự chọn theo thứ tự: Claude > OpenRouter > Gemini
          # (hoặc đặt biến MARKET_AGENTS_PROVIDER trong Settings -> Variables).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET_AGENTS_MODEL: ${{ vars.MARKET_AGENTS_MODEL || 'claude-opus-5-5' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Ưu tiên: lựa chọn khi chạy tay > biến MARKET_AGENTS_PROVIDER > tự chọn
          MARKET_AGENTS_PROVIDER: ${{ (github.event.inputs.provider != '' && github.event.inputs.provider != 'auto') && github.event.inputs.provider || vars.MARKET_AGENTS_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.session }}" ]; then ARGS="--session ${{ github.event.inputs.session }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --hold"; fi
          python -m market_agents.main $ARGS > /dev/null

      - name: Lưu báo cáo vào repo
        if: github.event.inputs.mode != 'check-models'
        run: |
          git config user.name "market-agents-bot"
          git config user.email "market-agents-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Báo cáo thị trường $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M')"
          git push
